services:
  # Nome do serviço deve ser igual ao do docker-compose.yml base
  weather-collector:
    volumes:
      - ./collector-weather:/app

  backend:
    command: npm run start:dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend-api:/app
      - /app/node_modules
      - ./uploads:/app/uploads
  
  frontend:
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
