services:
  # 🐰 RabbitMQ (Message Broker)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: desafioGDASH_rabbitmq
    restart: always
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    # Portas definidas no override. Aqui se for prod

  # 🍃 MongoDB (Banco de Dados)
  mongodb:
    image: mongo:latest
    container_name: desafioGDASH_mongo
    restart: always
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
  rabbitmq_data:
